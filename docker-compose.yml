services:
  chat-demo:
    build: .
    image: chat-demo:server
    container_name: chat-demo
    restart: unless-stopped
    # 内网直连用；公网经 NPM 反代到同一端口，因此这里必须监听全部接口
    ports:
      - "3000:3000"
    environment:
      # 访问密码：必填，建议 20 位以上随机串
      APP_PASSWORD: "${APP_PASSWORD:?APP_PASSWORD is required}"
      # 首次启动创建默认端点；之后在设置里改过的配置不会被覆盖
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      API_ORIGIN: "${API_ORIGIN:-}"
      API_MODEL: "${API_MODEL:-}"
      DATA_DIR: /data
      PORT: "3000"
      TZ: Asia/Shanghai
    volumes:
      # SQLite 数据库、附件原件、签名密钥都在这里；备份只需拷这个目录
      - ./data:/data
