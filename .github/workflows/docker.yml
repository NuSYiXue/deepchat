name: Build image

# 构建并推送容器镜像到 GitHub Container Registry（ghcr.io）。
#
# 用 GHCR 而不是 Docker Hub：仓库自带的 GITHUB_TOKEN 就能推送，不需要在仓库
# 里额外配置账号密码。镜像名固定为 ghcr.io/<owner>/<repo>，标签见下方 meta。
on:
  push:
    branches: [main]
    tags: ['v*']
  # 允许在 Actions 页面手动触发一次构建（例如刚改完 workflow 想立刻验证）
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 标签规则：分支构建打分支名与 short sha，tag 构建额外打版本号，
      # 默认分支额外打 latest。compose 里引用 latest 即最新一次 main 构建。
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 同一份源码重复构建时命中缓存，省掉重新装依赖与打包
          cache-from: type=gha
          cache-to: type=gha,mode=max
